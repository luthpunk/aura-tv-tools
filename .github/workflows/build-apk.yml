name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/aura-tv-tools.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aura-tv-tools-apk
          path: aura-tv-tools.apk

      - name: Publish GitHub release & update OTA metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VCODE=$(grep -E "versionCode\s*=" app/build.gradle.kts | awk -F'=' '{print $2}' | tr -d ' ')
          VNAME=$(grep -E "versionName\s*=" app/build.gradle.kts | sed -E "s/.*versionName\s*=\s*['\"]([^'\"]+)['\"].*/\1/")
          COMMIT_MSG=$(git log -1 --pretty=%s)
          DATE_STR=$(date -u +%Y-%m-%d)

          tag="build-${GITHUB_RUN_NUMBER}"
          for i in 1 2 3; do
            gh release delete "$tag" --cleanup-tag -y 2>/dev/null || true
            if gh release create "$tag" aura-tv-tools.apk \
              --title "Aura TV Tools ${tag} (v${VNAME})" \
              --notes "Built from ${GITHUB_SHA::7}. Download aura-tv-tools.apk for Android Phone." \
              --latest; then
              break
            fi
            sleep 4
          done

          mkdir -p release
          cat > release/version.json <<EOF
          {
            "versionCode": ${VCODE:-1},
            "versionName": "${VNAME:-1.0.0-id}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/aura-tv-tools.apk",
            "changelog": "${COMMIT_MSG}",
            "releaseDate": "${DATE_STR}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update OTA version.json to v${VNAME} (${VCODE})"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 4
            done
          fi
